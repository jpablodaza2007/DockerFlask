version: '3.8'

services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy-manager
    restart: always
    ports: 
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - web
    networks:
      - red_interna

  servidor-bd:
    image: mysql:8.0
    container_name: mysql_produccion
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: sena123
      MYSQL_DATABASE: adso_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red_interna

  web:
    image: juandazaalcazar/imagen:latest
    container_name: appdaza
    ports:
      - "5050:5050"
    env_file:
      - .env
    depends_on:
      - servidor-bd
    networks:
      - red_interna

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - red_interna

networks:
  red_interna:
    driver: bridge

volumes:
  db_data:
  uptime-kuma-data:
    name: uptime-kuma-data

  
