name: Publicar Imagen en Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -s B101 # Ignorar los archivos test

      - name: Ejecutar pruebas pytest
        run: PYTHONPATH=. pytest -s test_sample.py

  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Iniciar sesión en docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: juandazaalcazar/imagen:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juandazaalcazar/imagen:latest'
          format: 'table'
          exit-code: '1' # Si encuentra alguna falla, rompe la ejecución
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL' # Son los que van a detener la ejecución

      - name: Subir la imagen a Docker Hub
        run: docker push juandazaalcazar/imagen:latest

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/despliege
            docker compose pull web
            docker compose up -d